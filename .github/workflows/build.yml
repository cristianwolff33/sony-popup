name: Build SonyPopup

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build exe (PyInstaller)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name SonyPopup --icon sony_popup.ico
          --add-data "sony_popup.ico;."
          --add-data "wh-1000xm6.png;."
          --add-data "wh-ult900n.png;."
          --collect-all winrt
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtPdf
          sony_popup.py

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else { $v = "0.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip portable
        run: Compress-Archive -Path dist/SonyPopup/* -DestinationPath SonyPopup-win-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SonyPopup-${{ steps.ver.outputs.version }}
          path: |
            Output/SonyPopup-Setup.exe
            SonyPopup-win-x64-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/SonyPopup-Setup.exe
            SonyPopup-win-x64-portable.zip
