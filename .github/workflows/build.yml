name: Build SonyPopup

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build exe (PyInstaller)
        shell: pwsh
        run: |
          # wszystkie zdjęcia modeli (wh-*.png) trafiają do exe automatycznie
          $imgs = Get-ChildItem -File -Filter "wh-*.png" | ForEach-Object { "--add-data", "$($_.Name);." }
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name SonyPopup --icon sony_popup.ico `
            --add-data "sony_popup.ico;." @imgs `
            --collect-all winrt `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtPdf `
            sony_popup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DMyAppVersion=${{ needs.version.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip portable
        run: Compress-Archive -Path dist/SonyPopup/* -DestinationPath SonyPopup-win-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Output/SonyPopup-Setup.exe
            SonyPopup-win-x64-portable.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        run: bash ./macos/build_app.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/build/SonyPopup-macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Output/SonyPopup-Setup.exe
            dist/windows/SonyPopup-win-x64-portable.zip
            dist/macos/SonyPopup-macOS.dmg
