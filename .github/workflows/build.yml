name: Build SonyPopup.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name SonyPopup --icon sony_popup.ico
          --add-data "sony_popup.ico;."
          --add-data "wh-1000xm6.png;."
          --add-data "wh-ult900n.png;."
          --collect-all winrt
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtPdf
          sony_popup.py

      - name: Zip
        run: Compress-Archive -Path dist/SonyPopup/* -DestinationPath SonyPopup-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SonyPopup-win-x64
          path: SonyPopup-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SonyPopup-win-x64.zip
